    <section class='ck-screen' data-screen-view='about'>
      <div class='ck-card ck-info-page'>
        <div class='ck-info-page-head'><h2 style='margin:0;font-size:22px;font-weight:900;'>About Chatkie</h2><button class='ck-secondary-btn' onclick='ckApp.exitToHome()'>Home</button></div>
        <p><strong>Chatkie is a browser-based social chat experience</strong> built to help adults meet people around the world through random one-to-one video conversations, text chat, and topic-based public rooms.</p>
        <p>Chatkie includes WebRTC peer-to-peer media connections, a Firebase-powered signaling and matchmaking layer, optional language translation, camera effects, a short safety blur, and public rooms designed for up to six participants.</p>
        <h3>Our principles</h3>
        <p><strong>Respect:</strong> Treat everyone with courtesy. <strong>Consent:</strong> Accept or reject video invitations freely. <strong>Safety:</strong> Do not share sensitive personal information. Report or block people who break the rules.</p>
        <p>Chatkie supports Guest, Email/Password, and Google sign-in. Every user must complete the profile and confirm that they are at least 18 years old before using chat features. Connection quality depends on the browser, network, permissions, and available connectivity routes.</p>
        <p>Text Chat, Stranger Chat, and public-room messages are limited to 500 characters. Message bubbles are removed from the chat view after 30 seconds; shared photo previews are removed after 7 seconds. Typing indicators and small incoming-message notifications help you follow live conversations.</p>
        <p>Profile details and avatar/photo selections are stored in this browser's local storage. Firebase is used as a signaling and delivery relay; inbox items are removed by client code after delivery, but this does not guarantee that transport data is never transiently processed or stored by the service provider.</p>
        <p>For support, contact <a href='mailto:chatkie.web@gmail.com' style='color:var(--pine);font-weight:900;'>chatkie.web@gmail.com</a>.</p>
        <p><strong>Camera switching:</strong> During video chat, use the 🔄 button to switch between front and back cameras when the device/browser supports it. Country, age and preferred-language filters only improve matching when the partner advertises compatible preferences.</p>
        <p><strong>Safety:</strong> The stranger stage groups Friend, Report and Block in a labelled icon box; Fullscreen is placed beside the small camera preview. Public-room participant actions stay in each seat menu. Blocked IDs are kept in this browser and excluded from matching here. Report data is sent only when Firebase database rules permit it; browser-side checks alone are not a substitute for server-side moderation rules.</p>
        <p><strong>Community Rooms:</strong> Create a named room from the Public Rooms page. Room metadata is saved locally for the creator and shared through Firebase when configuration and database rules permit it. Visitors can knock only while the owner is online; the owner can approve or reject the knock.</p>
        <p><strong>Home and matching controls:</strong> The three primary Stranger Chat, Public Room, and Text Chat buttons appear immediately below the headline. Their centered labels keep the same text size while the buttons use a larger pill-shaped layout and a staggered pulse/shimmer animation. Motion-sensitive devices may reduce animation according to their system preference.</p>
        <p><strong>Matching filters:</strong> Gender selection appears first. The Region / Country Filter puts Global Worldwide, Same Country Only, and Specific Country on one row; the Any country selector sits directly under Specific Country. Preferred Language and Partner Age appear together below. The filters are best-effort and can only match metadata that other users make available.</p>
        <p><strong>Themes:</strong> Chatkie includes 20 colour presets, including Default, Ocean, Royal Purple, Sunset, Rose, Mint, Midnight, Crimson, Lavender, Graphite, and several 3D-inspired looks. Themes can change the page background, header, cards, text, accent colours, and controls. The selection is stored in this browser; the Default option restores the standard Chatkie palette. Device-level rendering and readability may vary by screen.</p>
        <p><strong>Video and sound controls:</strong> Use the camera-switch icon to switch between front and back cameras where supported. The 🎵 Music control plays a short synthesized melody locally after a user tap; it does not stream a music library. Beauty effects, masks, sound effects, fullscreen, safety blur, flying emojis, typing indicators, and the message panel are provided where their controls are shown.</p>
        <p><strong>Notifications and customization:</strong> Tap the header bell to toggle notifications. Browser permission must be granted before system notifications can appear, and notifications are generally shown for incoming messages while the page is in the background. Accent colour and chat bubble style are saved in this browser. Text chat people online is counted separately from Stranger Chat and Public Rooms.</p>
      </div>
    </section>

    <section class='ck-screen' data-screen-view='howto'>
      <div class='ck-card ck-info-page'>
        <div class='ck-info-page-head'><h2 style='margin:0;font-size:22px;font-weight:900;'>How to Use Chatkie</h2><button class='ck-secondary-btn' onclick='ckApp.exitToHome()'>Home</button></div>
        <ol class='ck-howto-list'>
          <li><strong>Sign in:</strong> Choose <em>Continue without Google (Guest)</em>, <em>Sign In with Email</em>/<em>Create Account</em>, or <em>Sign in with Google</em>. Then complete your profile, confirm that you are 18 or older, and submit it. Google login may redirect on mobile browsers.</li>
          <li><strong>Choose a chat type:</strong> The three large, rounded <em>Stranger Chat</em>, <em>Public Room</em>, and <em>Text Chat</em> buttons appear directly beneath the headline. Tap one to enter that mode. Their labels are centered and stay at the established text size; the buttons pulse and shimmer in sequence. Your device's reduced-motion preference can disable these effects.</li>
          <li><strong>Set your preferences:</strong> On the home page, choose <em>Match With Gender</em>, then use the one-row <em>Region / Country Filter</em>: Global Worldwide, Same Country Only, or Specific Country. The country selector marked <em>Any country</em> sits directly below the Specific Country tab; choose a country there to request that region. Below it, choose <em>Preferred Language</em> and <em>Partner Age</em> side by side. Matching is best-effort and depends on compatible peer metadata and who is online.</li>

          <li><strong>Notifications:</strong> Tap the bell in the header to switch notifications ON or OFF. When enabling them, allow browser notification permission if prompted. If permission is denied, the bell cannot force the browser to show system notifications.</li>
          <li><strong>Music and camera switch:</strong> In the video control area, tap the camera icon with two curved arrows to request front/back camera switching (depending on device/browser support). Tap 🎵 Music for a short locally synthesized melody; the browser may require a direct user tap to start audio.</li>
          <li><strong>Allow camera and microphone:</strong> When your browser asks, grant the permissions needed for video calls. If you deny them, video may not work; text chat does not need camera permission.</li>
          <li><strong>Use the video controls:</strong> Toggle the camera or microphone, tap 🔄 to switch front/back cameras when supported, mute the speaker, use the 💬 text-chat icon, try beauty effects or face masks, send emojis, and use the fullscreen icon beside the small camera preview. Friend, Report, and Block controls are grouped at the top of the video stage. Typing indicators appear while a partner types, and a short pop-up previews incoming messages near the keyboard button.</li>
          <li><strong>Safety blur:</strong> The remote video is blurred briefly when a call connects. Use the on-screen reveal control when you are ready to view it.</li>
          <li><strong>Translate messages:</strong> In video chat, open the chat panel and choose your target language. Translation depends on the external translation service and network availability.</li>
          <li><strong>Text chat:</strong> Find a text partner and send messages of up to 500 characters. Typing status appears above the composer. To move to video, press <em>Request Video Chat</em>. The other person must press Accept; either person can reject or end the conversation.</li>
          <li><strong>Public rooms:</strong> Choose a topic from the list or create a Community Room. Rooms support a maximum of six participant seats. Community Rooms use Firebase for shared metadata; localStorage alone cannot make a room visible to other devices. If the owner is online, tap Knock and wait for approval. Host controls are shown where supported.</li>
          <li><strong>Friends and invitations:</strong> Use the Friend or Invite controls where shown. A person must accept a private video-chat invitation before the private call begins.</li>
          <li><strong>Report, block, or leave:</strong> Use the icon-only stage box: person-plus adds a friend, flag submits a report, fullscreen expands the stage, and the blocked-circle skips a blocked peer on this browser. Report delivery depends on Firebase configuration and database rules. Press Exit/End Chat to leave.</li>
          <li><strong>Country and language preferences:</strong> Choose Global or Same Country where available. Smart language matching depends on users sharing language preferences; it cannot guarantee a match in a low-traffic region.</li>
          <li><strong>Log out:</strong> Open your profile and select <em>Logout and Delete Chat History</em>. This clears the current chat view and signs you out of Chatkie.</li>
        </ol>
        <p class='ck-text-safety-note'>Chatkie is for adults aged 18 and older. Never send money or disclose passwords, one-time codes, banking details, or sensitive identity documents to strangers.</p>
      </div>
    </section>
  </main>

  <div class='ck-modal' id='ck-privacy-modal'>
    <div style='display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;'>

    <div style='font-size:13.5px; line-height:1.55; color:var(--ink); display:flex; flex-direction:column; gap:10px;'>
      <div><strong>1. Local profile and preferences:</strong> Profile details, avatar/photo selections, friends, selected country/language/age preferences, theme, accent colour, and chat-bubble settings may be stored in this browser's local storage. This data can be accessible to anyone who can use the same unlocked browser. Clear local site data or use profile controls to remove supported local information.</div>
      <div><strong>2. Browser notifications and permissions:</strong> Chatkie requests browser notification permission only when you enable the notification control. You can switch the feature off from the header bell or revoke permission in your browser/device settings. Notification availability depends on browser settings and whether the page is in the background.</div>
      <div><strong>3. Chat transport and cleanup:</strong> Text bubbles are removed from the chat interface after 30 seconds and photo previews after 7 seconds. Firebase may be used for matchmaking, signaling, presence, invitations, and message relay; client cleanup does not guarantee that all data is never transiently processed or stored by a service provider. Review the Firebase project's configuration and retention policies for its actual handling.</div>
      <div><strong>4. Safety, blocking, and reports:</strong> Local controls can limit repeat messages, validate images, and skip blocked IDs on this browser. Reports or moderation events may be transmitted only when the backend configuration and database rules permit them. Client-side controls are not a guarantee against all abuse and do not replace server-side access rules or moderation.</div>
      <div><strong>5. Interface themes and animation:</strong> Theme selection changes the display of the header, page background, cards, buttons, and text. The selected theme is saved locally in this browser. Button animation respects the device's reduced-motion preference where supported.</div>
      <div><strong>6. Camera, microphone, and audio:</strong> Video and audio are requested through browser permissions. Camera-switch support depends on device and browser capabilities. The Music control creates a short tone sequence locally after a tap; it does not need an external music file or stream.</div>
      <div><strong>7. Use and age:</strong> Chatkie is intended for adults aged 18 and older. Do not share passwords, one-time codes, payment details, or sensitive personal information with strangers. You can end a chat at any time.</div>
      <div><strong>Contact:</strong> For questions about this policy or the interface, contact <a href='mailto:chatkie.web@gmail.com' style='color:var(--pine);font-weight:900;'>chatkie.web@gmail.com</a>.</div>

  const SECURITY_SALT = "CK_SEC_v9_100K_SHIELD";
  let blockedPeerStorage = [];
  try { blockedPeerStorage = JSON.parse(localStorage.getItem('ck_blocked_peer_uids') || '[]'); } catch(e) { blockedPeerStorage = []; }
  const blockedPeerUids = new Set(Array.isArray(blockedPeerStorage) ? blockedPeerStorage.map(x => String(x)) : []);
  const processedPacketIds = new Set();

  function escapeHTML(input, maxLen = 160) {
    if (typeof input !== 'string') return '';
    return input.slice(0, maxLen).replace(/[&<>"'`=\/]/g, function (s) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;', '`': '&#x60;', '=': '&#x3D;' }[s];
    });
  }

  function generatePacketSig(uid, type, tsBucket) {
    const raw = `${uid}_${type}_${tsBucket}_${SECURITY_SALT}`;
    let hash = 0;
    for (let i = 0; i < raw.length; i++) {
      hash = ((hash << 5) - hash) + raw.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash).toString(36);
  }

  function verifyPacketSig(pkt) {
    if (!pkt || !pkt.senderUid || !pkt.type || !pkt.sig) return false;
    const nowBucket = Math.floor(Date.now() / 15000);
    const sigCurr = generatePacketSig(pkt.senderUid, pkt.type, nowBucket);
    const sigPrev = generatePacketSig(pkt.senderUid, pkt.type, nowBucket - 1);
    const sigNext = generatePacketSig(pkt.senderUid, pkt.type, nowBucket + 1);
    return pkt.sig === sigCurr || pkt.sig === sigPrev || pkt.sig === sigNext;
  }

  function isPeerAllowed(pkt) {
    if (!pkt || !pkt.senderUid) return false;
    if (pkt.pktId) {
      if (processedPacketIds.has(pkt.pktId)) return false;
      processedPacketIds.add(pkt.pktId);
      if (processedPacketIds.size > 2000) {
        const firstKey = processedPacketIds.values().next().value;
        processedPacketIds.delete(firstKey);
      }
    }
    const uid = String(pkt.senderUid);
    if (blockedPeerUids.has(uid)) return false;
    if (!verifyPacketSig(pkt)) return false;
    return true;
  }

  function compressAndGuardPhoto(file, maxOutputBytes, callback) {
    if (!file || !file.type.startsWith('image/')) { alert("Please select a valid image file."); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const maxDim = 320;
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const compressedDataUrl = c.toDataURL('image/jpeg', 0.68);
        callback(compressedDataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Use one shared calendar boundary for every visitor: India Standard Time.
  function getIndiaDateKey(date = new Date()) {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
    const part = type => (parts.find(p => p.type === type) || {}).value || '00';
    return part('year') + '-' + part('month') + '-' + part('day');
  }
  let todayDateStr = getIndiaDateKey();
  let savedVisitorData = {};
  try { savedVisitorData = JSON.parse(localStorage.getItem('ck_day_visitor_tracker') || '{}') || {}; } catch(e) { savedVisitorData = {}; }
  if (savedVisitorData.date !== todayDateStr || !Number.isFinite(Number(savedVisitorData.visits))) {
    savedVisitorData = { date: todayDateStr, visits: 0 };
  }
  // Local fallback counts one visit per browser per India-calendar day; reloads do not inflate it.
  if (savedVisitorData.counted !== true) savedVisitorData.visits = Math.max(0, Number(savedVisitorData.visits) || 0) + 1;
  savedVisitorData.counted = true;
  try { localStorage.setItem('ck_day_visitor_tracker', JSON.stringify(savedVisitorData)); } catch(e) {}

  // Shared daily visitor total: Firebase is the source of truth across devices.
  // Local storage is only a fallback when Firebase is unavailable.
  let sharedDayVisitors = null;
  let dailyVisitorCounterStarted = false;
  let dailyVisitorCounterDate = todayDateStr;
  let dailyVisitorListenerRef = null;
  function setupSharedDailyVisitorCounter(user) {
    if (!fbDb || !user || !user.uid) return;
    const dateKey = getIndiaDateKey();
    if (dailyVisitorCounterStarted && dailyVisitorCounterDate === dateKey) return;
    if (dailyVisitorListenerRef) { try { dailyVisitorListenerRef.off('value'); } catch(e) {} }
    todayDateStr = dateKey;
    dailyVisitorCounterDate = dateKey;
    dailyVisitorCounterStarted = true;
    const visitorPath = 'ck_public_stats/day_visitors/' + todayDateStr;
    const visitorRef = fbDb.ref(visitorPath);
    dailyVisitorListenerRef = visitorRef;
    visitorRef.on('value', snapshot => {
      const value = snapshot.val();
      const count = value && Number(value.count);
      if (Number.isFinite(count) && count >= 0) {
        sharedDayVisitors = Math.floor(count);
        if (window.ckApp && typeof window.ckApp.recalculateLiveCounters === 'function') {
          window.ckApp.recalculateLiveCounters();
        } else {
          const header = document.getElementById('header-day-visitors');
          const drawer = document.getElementById('drawer-day-visitors');
          if (header) header.textContent = '👣 ' + sharedDayVisitors + ' Visits Today';
          if (drawer) drawer.textContent = sharedDayVisitors + ' Visits Today';
        }
      }
    }, err => { sharedDayVisitors = null; console.warn('Shared daily visitor counter read failed. Check Firebase Database Rules for ck_public_stats/day_visitors.', err); if (window.ckApp && typeof window.ckApp.recalculateLiveCounters === 'function') window.ckApp.recalculateLiveCounters(); });

    // Count this browser once per India-calendar day, across tabs and reloads.
    const sessionKey = 'ck_counted_visit_' + todayDateStr;
    try { if (localStorage.getItem(sessionKey) === '1') return; } catch(e) {}
    visitorRef.transaction(current => {
      const existing = current && Number.isFinite(Number(current.count)) ? Math.max(0, Math.floor(Number(current.count))) : 0;
      return { count: existing + 1, updatedAt: Date.now() };
    }, (error, committed, snapshot) => {
      if (error) {
        console.warn('Shared daily visitor counter update failed. Check Firebase Database Rules for ck_public_stats/day_visitors.', error);
        return;
      }
      if (committed) {
        try { localStorage.setItem(sessionKey, '1'); } catch(e) {}
        const value = snapshot && snapshot.val();
        if (value && Number.isFinite(Number(value.count))) sharedDayVisitors = Math.floor(Number(value.count));
        if (window.ckApp && typeof window.ckApp.recalculateLiveCounters === 'function') window.ckApp.recalculateLiveCounters();
      }
    }, false);
  }

  function broadcastMeshPacket(payload, targetTopic) {
    const nowBucket = Math.floor(Date.now() / 15000);
    const sig = generatePacketSig(state.uid, payload.type, nowBucket);
    const pktId = state.uid + '_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
    const msg = Object.assign({ senderUid: state.uid, ts: Date.now(), sig: sig, pktId: pktId }, payload);
    const raw = JSON.stringify(msg);
    const topic = targetTopic || MESH_LOBBY_TOPIC;

    if (fbDb && state.isAuthenticated && fbAuth && fbAuth.currentUser) {
      try {
        if (topic === MESH_LOBBY_TOPIC || topic === MESH_MATCH_TOPIC) {
          const ref = fbDb.ref('ck_v96_mesh/lobby/' + state.uid);
          ref.set(msg).then(() => {
            if (payload.type === 'heartbeat' && state.uid === msg.uid) {
              firebasePresenceWriteOk = true;
              scheduleThrottledCounterUpdate();
            }
          }).catch((err) => {
            if (payload.type === 'heartbeat') firebasePresenceWriteOk = false;
            console.warn('Chatkie online presence write failed. Check Firebase Database Rules and auth.', err);
            scheduleThrottledCounterUpdate();
          });
          ref.onDisconnect().remove().catch((err) => {
            console.warn('Chatkie onDisconnect setup failed.', err);
          });
        } else if (topic.startsWith(PERSONAL_INBOX_PREFIX)) {
          const destUid = topic.replace(PERSONAL_INBOX_PREFIX, '');
          if (destUid && destUid !== state.uid) {
            fbDb.ref('ck_v96_mesh/inbox/' + destUid).push(msg).catch((err) => {
              console.warn('Chatkie inbox delivery failed. Check Firebase Realtime Database Rules for ck_v96_mesh/inbox.', err);
            });
          }
        }
        // No writes are made to the global calls node; private signalling goes through user inboxes.
      } catch(e) {}

    }
    if (localBroadcast) {
      try { localBroadcast.postMessage(msg); } catch(e) {}
    }
  }

  function handleIncomingMeshPacket(data) {
    if (!isPeerAllowed(data)) return;
    if (data.type === 'heartbeat') {
      recordPeerHeartbeat(data);
    } else if (data.type === 'leave' && data.uid) {
      delete activePeersMap[data.uid];
      ckApp.cleanupSingleRoomPeer(data.uid);
      scheduleThrottledCounterUpdate();
    } else if (data.type === 'wakeup_match' && data.targetUid === state.uid) {
      if (state.isWaitingForStranger && !state.isPublicRoomMode && !state.isTextMode && data.callerPeer) {
        recordPeerHeartbeat(data.callerPeer);
        ckApp.attemptInstantMatchWithPeer(activePeersMap[data.callerPeer.uid]);
      }
    } else if (data.type === 'text_wakeup_match' && data.targetUid === state.uid) {
      if (state.isTextMode && state.currentScreen === 'text' && state.isWaitingForStranger && data.callerPeer) {
        recordPeerHeartbeat(data.callerPeer);
        ckApp.attemptTextMatchWithPeer(activePeersMap[data.callerPeer.uid]);
      }
    } else if (data.type === 'text_match_invite' && data.targetUid === state.uid) {
      if (state.isTextMode && state.currentScreen === 'text' && state.isWaitingForStranger) {
        state.isWaitingForStranger = false; state.currentPartnerUid = data.callerUid || data.senderUid; state.textPartnerUid = state.currentPartnerUid;
        ckApp.setTextChatStatus('Connected with ' + (data.callerName || 'your text partner') + '.');
        const list = document.getElementById('ck-text-chat-list'); if (list) list.innerHTML = '';
        ckApp.appendTextChatMessage('Chatkie', 'You are connected. Say hello!', false, true);
        const videoBtn = document.getElementById('ck-request-video-btn'); if (videoBtn) videoBtn.disabled = false;
        sendMyHeartbeat();
      }
    } else if (data.type === 'text_chat' && data.targetUid === state.uid && state.isTextMode && state.textPartnerUid === data.senderUid) {
      const senderLabel = activePeersMap[data.senderUid] ? activePeersMap[data.senderUid].name : 'Text Partner';
      ckApp.showTextTyping(data.senderUid, false);
      if (data.text || data.photo) { showKeyboardMessagePopup(senderLabel, data.text || '📷 Photo'); ckNotifyUser(senderLabel, data.text || '📷 Photo received'); }
      ckApp.appendTextChatMessage(senderLabel, String(data.text || '').slice(0,500), false, false, typeof data.photo === 'string' ? data.photo : null);
    } else if (data.type === 'text_typing' && data.targetUid === state.uid && state.isTextMode && state.textPartnerUid === data.senderUid) {
      ckApp.showTextTyping(data.senderUid, !!data.isTyping);
    } else if (data.type === 'text_leave' && data.targetUid === state.uid && state.textPartnerUid === data.senderUid) {
      state.textPartnerUid = null; state.currentPartnerUid = null; state.isWaitingForStranger = false;
      ckApp.setTextChatStatus('Your text partner has left. Find another partner to continue.');
      const videoBtn = document.getElementById('ck-request-video-btn'); if (videoBtn) videoBtn.disabled = true;
      ckApp.appendTextChatMessage('Chatkie', 'Your text partner left the conversation.', false, true);
    } else if (data.type === 'text_video_request' && data.targetUid === state.uid && state.isTextMode && state.textPartnerUid === data.senderUid) {
      ckNotifyUser(data.fromName || 'Text partner', 'Video chat invitation received.');
      pendingVideoSwitchInvite = { fromUid:data.senderUid, fromName:escapeHTML(data.fromName || 'Text Partner',28), roomId:escapeHTML(data.roomId || '',120) };
      document.getElementById('text-video-invite-text').textContent = (pendingVideoSwitchInvite.fromName || 'Your text partner') + ' wants to switch to video chat. Accept or reject the request.';
      document.getElementById('text-video-invite-popup').classList.add('open');
    } else if (data.type === 'text_video_accept' && data.targetUid === state.uid && data.senderUid === state.textPartnerUid && state.isTextMode) {
      ckApp.setTextChatStatus('Your partner accepted. Opening video chat…');
      ckApp.connectDirectStrangerPair(escapeHTML(data.roomId || '',120), true, data.senderUid, escapeHTML(data.fromName || 'Text Partner',28));
    } else if (data.type === 'text_video_reject' && data.targetUid === state.uid && data.senderUid === state.textPartnerUid) {
      ckApp.setTextChatStatus('Your partner declined the video request. You can continue texting.');
    } else if (data.type === 'friend_req_direct' && data.targetUid === state.uid) {
      showIncomingFriendRequestPopup(data);
    } else if (data.type === 'friend_accepted_ack' && data.targetUid === state.uid) {
      /* Two-Way Friend Sync: Automatically adds acceptor to sender's friend list */
      addFriendToLocalState(data.fromUid, data.fromName, data.fromCountryCode || '🌍');
      ckApp.appendChatMessage('System', `🤝 ${escapeHTML(data.fromName || 'Friend', 24)} accepted your friend request! Added to My Friends.`, false, true, null);
    } else if (data.type === 'room_seat_invite' && data.targetUid === state.uid) {
      showIncomingRoomSeatInvitePopup(data);
    } else if (data.type === 'private_chat_req' && data.targetUid === state.uid) {
      showIncomingPrivateChatInvitePopup(data);
    } else if (data.type === 'private_chat_accepted' && data.targetUid === state.uid) {
      ckApp.connectDirectStrangerPair(escapeHTML(data.directRoomId, 120), true, escapeHTML(data.fromUid, 40), escapeHTML(data.fromName, 28));
    } else if (data.type === 'match_invite' && data.targetUid === state.uid) {
      const callerUid = escapeHTML(data.callerUid, 40);
      if (state.isWaitingForStranger || (state.currentPartnerUid === callerUid && state.uid < callerUid)) {
        state.isWaitingForStranger = false;
        state.currentPartnerUid = callerUid;
        ckApp.startWebRTCPeer(escapeHTML(data.roomId, 120), false, escapeHTML(data.callerName, 28), data.callerGender, escapeHTML(data.callerCountry, 8));
      }
    } else if (data.type === 'webrtc_signal' && data.targetUid === state.uid) {
      if (state.isPublicRoomMode && data.roomId === state.currentRoomId) {
        ckApp.handleRoomWebRTCSignal(data);
      } else if (!state.isPublicRoomMode && (!state.currentRoomId || data.roomId === state.currentRoomId)) {
        ckApp.handleWebRTCSignal(data);
      }
    } else if (data.type === 'room_event' && data.roomId === state.currentRoomId && data.senderUid !== state.uid) {
      ckApp.handleRoomEvent(data);
    }
  }

  function initServerlessSignalingMesh() {
    if (meshInitialized || !isChatkieProfileComplete() || !fbDb || !fbAuth || !fbAuth.currentUser) return;
    meshInitialized = true;
    if ('BroadcastChannel' in window) {
      localBroadcast = new BroadcastChannel('chatkie_v96_channel');
      localBroadcast.onmessage = (ev) => handleIncomingMeshPacket(ev.data);
    }
    if (fbDb && state.uid) {
      try {
        fbConnectionListenerRef = fbDb.ref('.info/connected');
        fbConnectionListenerRef.on('value', (snap) => {
          firebasePresenceConnected = snap.val() === true;
          if (!firebasePresenceConnected) firebasePresenceWriteOk = false;
          else sendMyHeartbeat();
          scheduleThrottledCounterUpdate();
        });
        fbLobbyListenerRef = fbDb.ref('ck_v96_mesh/lobby');
        fbLobbyListenerRef.on('child_added', (snap) => { const pkt = snap.val(); if (pkt && pkt.senderUid !== state.uid) handleIncomingMeshPacket(pkt); });
        fbLobbyListenerRef.on('child_changed', (snap) => { const pkt = snap.val(); if (pkt && pkt.senderUid !== state.uid) handleIncomingMeshPacket(pkt); });
        fbInboxListenerRef = fbDb.ref('ck_v96_mesh/inbox/' + state.uid);
        fbInboxListenerRef.on('child_added', (snap) => {
          const pkt = snap.val();
          const packetAge = pkt && Number(pkt.ts) ? Date.now() - Number(pkt.ts) : 0;
          // Ignore stale queued chat/signalling packets on reconnect; remove every consumed entry.
          if (pkt && pkt.senderUid !== state.uid && packetAge <= 45000) handleIncomingMeshPacket(pkt);
          try { snap.ref.remove().catch(() => {}); } catch(e) {}
        });
      } catch(e) { meshInitialized = false; }
    }
    sendMyHeartbeat();
    updateHeartbeatLoop();
  }

  let audioCtx = null;
  function playSynthSfx(type) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      if (type === 'music') {
        // Short, lightweight melody synthesized locally; no audio asset or network call needed.
        const notes = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 783.99];
        notes.forEach((frequency, index) => {
          const start = now + index * 0.145;
          const osc = audioCtx.createOscillator();
          const env = audioCtx.createGain();
          osc.type = index % 3 === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(frequency, start);
          env.gain.setValueAtTime(0.0001, start);
          env.gain.linearRampToValueAtTime(0.11, start + 0.018);
          env.gain.exponentialRampToValueAtTime(0.0001, start + 0.135);
          osc.connect(env); env.connect(audioCtx.destination);
          osc.start(start); osc.stop(start + 0.145);
        });
        return;
      }
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.frequency.setValueAtTime(type === 'horn' ? 280 : 440, now);
      env.gain.setValueAtTime(0.25, now);
      env.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(env);
      env.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    } catch(e) {}
  }

  async function translateTextGTX(rawText, targetLang) {

      const data = await res.json();
      if (Array.isArray(data) && Array.isArray(data[0])) return data[0].map(s => s[0]).join(" ");

    return rawText;
  }

  function setupChatkieAuthGate() {
    if (!fbAuth || !isFirebaseConfigured()) {
      // Keep the public landing screen visible while Firebase is still being configured.
      // Login, matchmaking and database-backed rooms remain unavailable until real keys are added.
      state.isAuthenticated = false;
      lockChatkieUntilLogin(false);
      const backdrop = document.getElementById('ck-backdrop');
      const setupModal = document.getElementById('ck-profile-setup-modal');
      if (backdrop) backdrop.classList.remove('open');
      if (setupModal) setupModal.classList.remove('open');
      if (typeof ckShowToast === 'function') {
        ckShowToast('Firebase setup is pending. The home screen is available; sign-in and chat need Firebase configuration.', 6500);
      }
      return;
    }
    fbAuth.getRedirectResult().then(result => {
      if (result && result.user) ckApp.applyGoogleUser(result.user);
    }).catch(err => console.warn('Google redirect result:', err && err.code ? err.code : err));
    fbAuth.onAuthStateChanged(user => {
      const hasSupportedProvider = !!(user && (user.isAnonymous || user.email ||
        (Array.isArray(user.providerData) && user.providerData.some(p => p && (p.providerId === 'google.com' || p.providerId === 'password')))));
      state.isAuthenticated = hasSupportedProvider;
      if (!hasSupportedProvider) {
        stopServerlessSignalingMesh();
        state.isWaitingForStranger = false;
        lockChatkieUntilLogin(true);
        ckApp.openProfileModal(false, true);
        return;
      }
      const previousOwnerUid = localStorage.getItem('ck_profile_owner_uid') || localStorage.getItem('ck_google_uid');
      if (previousOwnerUid && previousOwnerUid !== user.uid) {
        ['ck_name','ck_gender','ck_age','ck_avatar','ck_country','ck_adult_confirmed','ck_friends','ck_profile_owner_uid','ck_google_uid'].forEach(k => localStorage.removeItem(k));
        state.name = 'Guest'; state.age = 0; state.hasAcceptedAge = false; state.gender = 'Male'; state.avatar = '👨'; state.friends = [];
      }
      state.googleUid = user.uid;
      state.uid = user.uid;
      state.accountEmail = user.email || '';
      state.accountPhotoURL = user.photoURL || '';
      try { if (state.accountEmail) localStorage.setItem('ck_account_email', state.accountEmail); else localStorage.removeItem('ck_account_email'); if (state.accountPhotoURL) localStorage.setItem('ck_account_photo', state.accountPhotoURL); else localStorage.removeItem('ck_account_photo'); } catch(e) {}
      localStorage.setItem('ck_google_uid', user.uid);
      localStorage.setItem('ck_persistent_uid', user.uid);
      setupSharedDailyVisitorCounter(user);
      const accountDisplayName = user.displayName || (user.email ? user.email.split('@')[0] : (user.isAnonymous ? 'Guest' : ''));
      if (accountDisplayName && (!localStorage.getItem('ck_name') || localStorage.getItem('ck_name') === 'Guest')) {
        const name = escapeHTML(accountDisplayName, 28);
        state.name = name;
        localStorage.setItem('ck_name', name);
      }
      if (isChatkieProfileComplete()) {
        lockChatkieUntilLogin(false);
        const modal = document.getElementById('ck-profile-setup-modal');
        const backdrop = document.getElementById('ck-backdrop');
        if (modal) modal.classList.remove('open');
        if (backdrop) backdrop.classList.remove('open');
        ckApp.refreshProfileView();
        if (!meshInitialized) initServerlessSignalingMesh();
      } else {
        lockChatkieUntilLogin(true);
        ckApp.openProfileModal(false, true);
      }
    });
  }

        if (!p || (now - p.ts > 15000)) { delete activePeersMap[uid]; return; }

        // this browser counts itself only after Firebase confirms connection and its lobby write succeeds.
        if (uid === state.uid && !(firebasePresenceConnected && firebasePresenceWriteOk)) return;
        totalOnline++;

            if (!isNaN(rIdx) && rIdx >= 0 && rIdx < FIFTY_ROOMS.length) {
              roomBuckets[rIdx] = Math.min(6, roomBuckets[rIdx] + 1);

      const videoBtn = document.getElementById('ck-request-video-btn'); if (videoBtn) videoBtn.disabled = true;

    findTextMatchFromActivePeers() {
      if (!state.isTextMode || !state.isWaitingForStranger || state.currentPartnerUid) return;
      const now = Date.now();
      const peers = Object.values(activePeersMap).filter(p => p && p.uid !== state.uid && p.mode === 'text' && p.screen === 'text' && p.isWaiting && !p.roomId && now - (p.ts || 0) < 12000 && !blockedPeerUids.has(p.uid));
      for (const peer of peers) { if (this.attemptTextMatchWithPeer(peer)) break; }
    },

    attemptTextMatchWithPeer(peer) {
      if (!state.isTextMode || !state.isWaitingForStranger || state.currentPartnerUid || !peer || peer.uid === state.uid || peer.mode !== 'text' || !peer.isWaiting || blockedPeerUids.has(peer.uid)) return false;
      if (Date.now() - (Number(peer.ts) || 0) > 12000) return false;
      if (state.targetGender !== 'Both' && peer.gender !== state.targetGender) return false;
      if (peer.targetGender && peer.targetGender !== 'Both' && peer.targetGender !== state.gender) return false;
      if (state.regionFilter === 'LOCAL' && peer.country !== state.country.name) return false;
      if (state.uid > peer.uid) {
        state.isWaitingForStranger = false; state.currentPartnerUid = peer.uid; state.textPartnerUid = peer.uid;
        const roomId = 'txt_' + [state.uid, peer.uid].sort().join('_') + '_' + Date.now();
        broadcastMeshPacket({ type:'text_match_invite', targetUid:peer.uid, callerUid:state.uid, callerName:state.name, roomId:roomId }, PERSONAL_INBOX_PREFIX + peer.uid);
        this.setTextChatStatus('Connected with ' + (peer.name || 'your text partner') + '.');
        this.appendTextChatMessage('Chatkie', 'You are connected. Say hello!', false, true);
        const videoBtn = document.getElementById('ck-request-video-btn'); if (videoBtn) videoBtn.disabled = false;
        sendMyHeartbeat(); return true;
      }
      broadcastMeshPacket({ type:'text_wakeup_match', targetUid:peer.uid, callerPeer:buildMyHeartbeatObject() }, PERSONAL_INBOX_PREFIX + peer.uid);
      return false;
    },

    sendTextMessage() {

      broadcastMeshPacket({ type:'text_chat', targetUid:state.textPartnerUid, text:message }, PERSONAL_INBOX_PREFIX + state.textPartnerUid);

    handleTextPhotoAttach(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      if (!state.textPartnerUid || !state.isTextMode || state.isWaitingForStranger) {

      if (!file.type || !file.type.startsWith('image/')) { alert('Please choose an image file.'); input.value = ''; return; }
      // Inbox Rules cap the photo field at 120,000 characters; use a small compressed thumbnail.
      compressAndGuardPhoto(file, 85 * 1024, (dataUrl) => {
        if (!dataUrl || dataUrl.length > 115000) {
          alert('This photo is too large after compression. Please choose a smaller image.');

      });

    requestVideoFromTextPartner() {

    endTextChat() {

        broadcastMeshPacket({ type:'text_leave', targetUid:state.textPartnerUid, fromUid:state.uid, fromName:state.name }, PERSONAL_INBOX_PREFIX + state.textPartnerUid);
      }
      state.isTextMode = false; state.textPartnerUid = null; state.isWaitingForStranger = false;
      this.disconnectCall(); this.go('home');
    },

    async ensureCameraAndCanvasPipeline() {
      if (state.canvasStream && state.rawStream && state.rawStream.active) return state.canvasStream;
      if (state.cameraInitPromise) return state.cameraInitPromise;

      state.cameraInitPromise = (async () => {
        try {
          const rawVideo = document.getElementById('raw-cam');
          const canvas = document.getElementById('filter-canvas');
          const ctx = canvas.getContext('2d');
          const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: true });
          state.rawStream = stream;
          rawVideo.srcObject = stream;
          await rawVideo.play().catch(() => {});

          const renderFrame = () => {
            if (rawVideo.readyState >= 2 && state.camEnabled) {
              if (state.activeBeauty === 'smooth') ctx.filter = 'contrast(1.04) brightness(1.06) saturate(1.08)';
              else if (state.activeBeauty === 'rose') ctx.filter = 'sepia(0.18) saturate(1.3) hue-rotate(-10deg)';
              else if (state.activeBeauty === 'cool') ctx.filter = 'saturate(1.1) hue-rotate(12deg) brightness(1.05)';
              else if (state.activeBeauty === 'bright') ctx.filter = 'brightness(1.18) contrast(1.05)';
              else if (state.activeBeauty === 'vintage') ctx.filter = 'sepia(0.35) contrast(1.08)';
              else ctx.filter = 'none';
              ctx.drawImage(rawVideo, 0, 0, canvas.width, canvas.height);
              ctx.filter = 'none';
              if (state.activeMask && state.activeMask !== 'none' && currentFacePose) {
                const lp = currentFacePose.leftEye, rp = currentFacePose.rightEye;
                const cx = ((lp.x + rp.x) / 2) * canvas.width;
                const cy = ((lp.y + rp.y) / 2) * canvas.height + canvas.height * 0.035;
                const angle = Math.atan2((rp.y - lp.y) * canvas.height, (rp.x - lp.x) * canvas.width);
                const maskFontSize = Math.max(10, Math.min(80, state.maskSizePercent || 28)) * canvas.width / 100;
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
                ctx.font = `${maskFontSize}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(state.activeMask, 0, 0); ctx.restore();
              }
              if (faceLandmarker && rawVideo.readyState >= 2 && performance.now() - lastFaceDetectAt > 100) {
                lastFaceDetectAt = performance.now();
                try {
                  const faceResult = faceLandmarker.detectForVideo(rawVideo, lastFaceDetectAt);
                  const marks = faceResult && faceResult.faceLandmarks && faceResult.faceLandmarks[0];
                  currentFacePose = marks ? { leftEye: marks[33], rightEye: marks[263] } : null;
                } catch(faceErr) { currentFacePose = null; }
              }
            } else {
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = '#94a3b8';
              ctx.font = 'bold 22px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('Camera Off', canvas.width / 2, canvas.height / 2);
            }
            requestAnimationFrame(renderFrame);
          };
          requestAnimationFrame(renderFrame);

          const cStream = canvas.captureStream ? canvas.captureStream(25) : stream;
          stream.getAudioTracks().forEach(t => { t.enabled = state.micEnabled; cStream.addTrack(t); });
          state.canvasStream = cStream;
          const pipVideo = document.getElementById('local-pip-video');
          if (pipVideo) pipVideo.srcObject = cStream;
          return cStream;
        } catch(e) {
          const canvas = document.getElementById('filter-canvas');
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const fallbackStream = canvas.captureStream ? canvas.captureStream(10) : new MediaStream();
          state.canvasStream = fallbackStream;
          const pipVideo = document.getElementById('local-pip-video');
          if (pipVideo) pipVideo.srcObject = fallbackStream;
          return fallbackStream;
        } finally {
          state.cameraInitPromise = null;
        }
      })();
      return state.cameraInitPromise;
    },

    /* Instant Button Response & Non-Blocking Stranger Matchmaking */
    ensureAdultProfile() {
      if (isChatkieProfileComplete()) return true;
      this.openProfileModal(false, true);
      alert("Chatkie is for adults aged 18 and older. Complete your age and profile verification to continue.");
      return false;
    },

    findStranger() {
      if (!this.ensureAdultProfile()) return;
      this.disconnectCall();
      state.isTextMode = false;
      state.textPartnerUid = null;
      state.isPublicRoomMode = false;
      state.currentRoomIndex = -1;
      state.isWaitingForStranger = true;
      updateHeartbeatLoop();
      state.isCallEstablished = false;
      state.currentPartnerUid = null;
      state.currentRoomId = null;

      document.getElementById('ck-video-stage').classList.remove('is-room-mode');
      document.getElementById('call-mode-title').textContent = 'Live Stranger Chat';


      /* Navigate immediately so button click reacts in <10ms */
      this.go('stranger');
      this.setPeerStatusPill('Searching for a stranger...', '🔍', 0);
      sendMyHeartbeat();

      const tryMatchNow = () => {
        if (!state.isWaitingForStranger || state.isPublicRoomMode) return;
        const now = Date.now();
        const candidates = Object.values(activePeersMap).filter(p => p && p.uid !== state.uid && (now - p.ts) < 12000 && p.isWaiting && p.screen === 'stranger' && p.mode !== 'text' && !p.roomId && !blockedPeerUids.has(p.uid) && (p.targetGender === 'Both' || p.targetGender === state.gender));
        for (let i = 0; i < candidates.length; i++) {
          if (this.attemptInstantMatchWithPeer(candidates[i])) break;
        }
      };

      this.findMatchFromActivePeers();
      this.ensureCameraAndCanvasPipeline().then(() => {
        sendMyHeartbeat();
        tryMatchNow();
      });
    },

    findMatchFromActivePeers() {
      if (!state.isWaitingForStranger || state.isPublicRoomMode || state.currentPartnerUid) return;
      const now = Date.now();
      const candidates = Object.values(activePeersMap).filter(p => p && p.uid !== state.uid && (now - p.ts) < 12000 && p.isWaiting && p.screen === 'stranger' && p.mode !== 'text' && !p.roomId && !blockedPeerUids.has(p.uid) && (p.targetGender === 'Both' || p.targetGender === state.gender));
      for (const peer of candidates) {
        if (this.attemptInstantMatchWithPeer(peer)) break;
      }
    },

    attemptInstantMatchWithPeer(peer) {
      if (!state.isWaitingForStranger || state.currentPartnerUid || !peer || peer.uid === state.uid || !peer.isWaiting) return false;
      if (blockedPeerUids.has(peer.uid)) return false;
      if (Date.now() - (Number(peer.ts) || 0) > 12000) return false;
      if (state.targetGender !== 'Both' && peer.gender !== state.targetGender) return false;
      if (peer.targetGender && peer.targetGender !== 'Both' && peer.targetGender !== state.gender) return false;
      if (state.regionFilter === 'LOCAL' && peer.country !== state.country.name) return false;

      if (state.uid > peer.uid) {
        state.isWaitingForStranger = false;
        state.currentPartnerUid = peer.uid;
        const roomId = 'str_' + state.uid + '_' + peer.uid + '_' + Date.now();
        broadcastMeshPacket({
          type: 'match_invite',
          targetUid: peer.uid,
          callerUid: state.uid,
          callerName: state.name,
          callerGender: state.gender,
          callerCountry: state.country.code,
          roomId: roomId
        }, PERSONAL_INBOX_PREFIX + peer.uid);
        this.startWebRTCPeer(roomId, true, peer.name, peer.gender, peer.countryCode);
        return true;
      } else {
        /* Wake up the higher-UID peer immediately so neither waits 4 seconds */
        broadcastMeshPacket({
          type: 'wakeup_match',
          targetUid: peer.uid,
          callerPeer: buildMyHeartbeatObject()
        }, PERSONAL_INBOX_PREFIX + peer.uid);
        return false;
      }
    },

    async startWebRTCPeer(roomId, isCaller, partnerName, partnerGender, partnerCountry) {
      this.cleanup1on1PeerOnly();
      state.peerSetupReady = false;
      state.currentRoomId = roomId;
      state.isWaitingForStranger = false;
      state.iceCandidateQueue = [];
      subscribeToPrivateCallTopic(roomId);

      /* Create RTCPeerConnection synchronously BEFORE awaiting camera so no offer/signal is ever dropped */
      const pc = new RTCPeerConnection(rtcConfig);
      state.peerConnection = pc;

      pc.onicecandidate = (ev) => {
        if (ev.candidate && state.currentPartnerUid) {
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: state.currentPartnerUid,
            signalType: 'candidate',
            candidate: ev.candidate ? ev.candidate.toJSON() : null
          }, state.currentPartnerUid, state.currentRoomId);
        }
      };

      pc.ontrack = (ev) => {
        const remVid = document.getElementById('remote-video');
        if (remVid && ev.streams && ev.streams[0]) {
          remVid.srcObject = ev.streams[0];
          remVid.muted = state.speakerMuted;
          remVid.play().catch(() => {});
          this.triggerSafetyBlur();
        }
      };

      let connectTimeoutHandle = setTimeout(() => {
        if (state.peerConnection === pc && !state.isCallEstablished) {
          this.setPeerStatusPill('Video connection timed out. Check network/TURN settings, then tap NEXT STRANGER to retry.', '⚠️', 0);
          try { pc.close(); } catch(e) {}
          if (state.peerConnection === pc) { state.peerConnection = null; state.peerSetupReady = false; }
        }
      }, 30000);
      pc.oniceconnectionstatechange = () => {
        if (state.peerConnection !== pc) return;
        if (pc.iceConnectionState === 'failed') {
          this.setPeerStatusPill('Direct video path failed. Your messages may still work; check network/TURN settings or tap NEXT STRANGER.', '⚠️', 0);
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
          if (connectTimeoutHandle) { clearTimeout(connectTimeoutHandle); connectTimeoutHandle = null; }
          state.isCallEstablished = true;
          if (state.offerRetryTimer) { clearInterval(state.offerRetryTimer); state.offerRetryTimer = null; }
          this.setPeerStatusPill(`Connected with ${partnerName || 'Stranger'} (${partnerCountry || '🌍'})`, '🟢', 3500);
        } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
          if (connectTimeoutHandle) { clearTimeout(connectTimeoutHandle); connectTimeoutHandle = null; }
          if (state.peerConnection !== pc) return;
          if (state.currentScreen === 'stranger' && !state.isPublicRoomMode) {
            this.setPeerStatusPill('Video connection ended. Tap NEXT STRANGER to search again.', '⚠️', 0);
          }
        }
      };

      this.setPeerStatusPill(`Connecting to ${partnerName || 'Stranger'}...`, '⚡', 0);
      sendMyHeartbeat();

      const stream = await this.ensureCameraAndCanvasPipeline();
      if (state.peerConnection !== pc) return;
      if (stream) {
        stream.getTracks().forEach(t => {
          try { pc.addTrack(t, stream); } catch(e) {}
        });
      }

      /* Do not process an incoming offer until local media/transceivers are ready.
         Otherwise the callee can create an answer before its camera tracks are added. */
      state.peerSetupReady = true;
      while (state.pendingSignalsQueue.length > 0) {
        const earlySig = state.pendingSignalsQueue.shift();
        await this.handleWebRTCSignal(earlySig);
      }

      if (isCaller) {
        const sendOfferNow = async () => {
          if (state.peerConnection !== pc || state.isCallEstablished) return;
          try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendSignalToPeerAndRoom({
              type: 'webrtc_signal',
              roomId: state.currentRoomId,
              targetUid: state.currentPartnerUid,
              signalType: 'offer',
              sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
            }, state.currentPartnerUid, state.currentRoomId);
          } catch(e) {}
        };
        await sendOfferNow();
        if (state.offerRetryTimer) clearInterval(state.offerRetryTimer);
        state.offerRetryTimer = setInterval(() => {
          if (!state.peerConnection || state.isCallEstablished || pc.signalingState === 'stable') {
            clearInterval(state.offerRetryTimer);
            state.offerRetryTimer = null;
            return;
          }
          if (pc.localDescription) {
            sendSignalToPeerAndRoom({
              type: 'webrtc_signal',
              roomId: state.currentRoomId,
              targetUid: state.currentPartnerUid,
              signalType: 'offer',
              sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
            }, state.currentPartnerUid, state.currentRoomId);
          }
        }, 700);
      } else if (state.currentPartnerUid) {
        /* Notify caller that callee is ready to receive offer immediately */
        sendSignalToPeerAndRoom({
          type: 'webrtc_signal',
          roomId: state.currentRoomId,
          targetUid: state.currentPartnerUid,
          signalType: 'peer_ready'
        }, state.currentPartnerUid, state.currentRoomId);
      }
    },

    async handleWebRTCSignal(data) {
      const pc = state.peerConnection;
      if (!pc || !state.peerSetupReady) {
        /* Keep the signal until RTCPeerConnection and local media setup are ready. */
        if (data && data.signalType) {
          const duplicate = state.pendingSignalsQueue.some(x => x && x.senderUid === data.senderUid && x.signalType === data.signalType && (x.sdp && data.sdp ? x.sdp.sdp === data.sdp.sdp : x.candidate && data.candidate ? x.candidate.candidate === data.candidate.candidate : false));
          if (!duplicate) state.pendingSignalsQueue.push(data);
        }
        return;
      }
      try {
        if (data.signalType === 'peer_ready' && pc.localDescription && pc.localDescription.type === 'offer') {
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: data.senderUid,
            signalType: 'offer',
            sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
          }, data.senderUid, state.currentRoomId);
        } else if (data.signalType === 'offer') {
          if (!data.sdp || !data.sdp.sdp) return;
          if (!state.currentPartnerUid) state.currentPartnerUid = data.senderUid;
          const incomingOfferSdp = data.sdp.sdp;

          /* The caller retries offers while waiting for an answer. Do not process the
             same SDP repeatedly; resend the existing answer if a retry arrives. */
          if (pc.__chatkieHandledOfferSdp === incomingOfferSdp && pc.localDescription && pc.localDescription.type === 'answer') {
            sendSignalToPeerAndRoom({
              type: 'webrtc_signal', roomId: state.currentRoomId,
              targetUid: data.senderUid, signalType: 'answer',
              sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
            }, data.senderUid, state.currentRoomId);
            return;
          }
          if (pc.signalingState !== 'stable') return;
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          pc.__chatkieHandledOfferSdp = incomingOfferSdp;
          while (state.iceCandidateQueue.length > 0) {
            await pc.addIceCandidate(new RTCIceCandidate(state.iceCandidateQueue.shift())).catch(() => {});
          }
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: data.senderUid,
            signalType: 'answer',
            sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
          }, data.senderUid, state.currentRoomId);
        } else if (data.signalType === 'answer') {
          if (pc.signalingState === 'have-local-offer') {
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            while (state.iceCandidateQueue.length > 0) {
              await pc.addIceCandidate(new RTCIceCandidate(state.iceCandidateQueue.shift())).catch(() => {});
            }
          }
        } else if (data.signalType === 'candidate' && data.candidate) {
          if (pc.remoteDescription && pc.remoteDescription.type) {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
          } else {
            state.iceCandidateQueue.push(data.candidate);
          }
        }
      } catch(e) { console.warn('Chatkie WebRTC signaling error:', data && data.signalType, e); }
    },

    triggerSafetyBlur() {
      const remVid = document.getElementById('remote-video');
      const shield = document.getElementById('safety-blur-shield');
      if (state.blurTimer) clearTimeout(state.blurTimer);
      if (remVid) remVid.classList.add('safety-blur');
      if (shield) shield.classList.add('active');
      state.blurTimer = setTimeout(() => { this.unblurRemoteVideo(); }, 3000);
    },

    unblurRemoteVideo() {
      if (state.blurTimer) { clearTimeout(state.blurTimer); state.blurTimer = null; }
      const remVid = document.getElementById('remote-video');
      const shield = document.getElementById('safety-blur-shield');
      if (remVid) remVid.classList.remove('safety-blur');
      if (shield) shield.classList.remove('active');
    },

    swapVideoLayout() {
      const remVid = document.getElementById('remote-video');
      const pipVid = document.getElementById('local-pip-video');
      if (!remVid || !pipVid) return;
      const tmp = remVid.srcObject;
      remVid.srcObject = pipVid.srcObject;
      pipVid.srcObject = tmp;
      remVid.play().catch(() => {});
      pipVid.play().catch(() => {});
    },

    /* Public Room Instant Join & Multi-Peer WebRTC Mesh */
    joinPublicRoom(roomIdx, preferredSeatIdx) {
      if (!this.ensureAdultProfile()) return;
      if (!Number.isInteger(roomIdx) || roomIdx < 0 || roomIdx >= FIFTY_ROOMS.length) return;
      this.disconnectCall();
      state.isPublicRoomMode = true;
      state.isWaitingForStranger = false;
      updateHeartbeatLoop();
      state.currentRoomIndex = roomIdx;
      state.currentRoomId = 'public_room_' + roomIdx;

      const occupiedSeats = new Set();
      Object.values(activePeersMap).forEach(p => {
        if (p && p.uid !== state.uid && p.roomId === state.currentRoomId && p.roomSeatIdx >= 0) {
          occupiedSeats.add(p.roomSeatIdx);
        }
      });

      let chosenSeat = (typeof preferredSeatIdx === 'number' && !occupiedSeats.has(preferredSeatIdx)) ? preferredSeatIdx : -1;
      if (chosenSeat === -1) {
        for (let s = 0; s < 6; s++) {
          if (!occupiedSeats.has(s)) { chosenSeat = s; break; }
        }
      }
      if (chosenSeat === -1) {
        alert("Room is full (6/6). Please pick another!");
        this.go('rooms');
        return;
      }

      state.myRoomSeatIdx = chosenSeat;
      document.getElementById('ck-video-stage').classList.add('is-room-mode');
      document.getElementById('call-mode-title').textContent = FIFTY_ROOMS[roomIdx];


      /* Instant UI response */
      this.go('stranger');
      this.setPeerStatusPill(`${FIFTY_ROOMS[roomIdx]} • Seat #${chosenSeat + 1}`, '👥', 3500);
      subscribeToPrivateCallTopic(state.currentRoomId);
      sendMyHeartbeat();
      this.renderRoomGrid6();

      this.ensureCameraAndCanvasPipeline().then(() => {
        sendMyHeartbeat();
        this.renderRoomGrid6();
      });
    },

    renderRoomGrid6() {
      if (!state.isPublicRoomMode) return;
      const seatOccupants = {};
      seatOccupants[state.myRoomSeatIdx] = {
        uid: state.uid,
        name: state.name + ' (You)',
        countryCode: state.country.code,
        isMe: true
      };

      Object.values(activePeersMap).forEach(p => {
        if (p && p.uid !== state.uid && p.roomId === state.currentRoomId && p.roomSeatIdx >= 0 && p.roomSeatIdx < 6) {
          if (!seatOccupants[p.roomSeatIdx]) seatOccupants[p.roomSeatIdx] = p;
          if (!state.roomPeerConnections[p.uid]) {
            this.ensureRoomPeerConnection(p.uid, state.uid > p.uid);
          }
        }
      });

      for (let i = 0; i < 6; i++) {
        const slotEl = document.getElementById(`room-slot-${i}`);
        if (!slotEl) continue;
        const occ = seatOccupants[i];
        const prevUid = slotEl.getAttribute('data-occupant-uid') || '';

    async ensureRoomPeerConnection(peerUid, isInitiator) {
      if (state.roomPeerConnections[peerUid]) return state.roomPeerConnections[peerUid];

      /* Synchronous creation prevents race conditions during camera init */
      const pc = new RTCPeerConnection(rtcConfig);
      state.roomPeerConnections[peerUid] = pc;
      if (!state.roomIceQueues[peerUid]) state.roomIceQueues[peerUid] = [];

      pc.onicecandidate = (ev) => {
        if (ev.candidate && state.currentRoomId) {
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: peerUid,
            signalType: 'candidate',
            candidate: ev.candidate ? ev.candidate.toJSON() : null
          }, peerUid, state.currentRoomId);
        }
      };

      pc.ontrack = (ev) => {
        if (ev.streams && ev.streams[0]) {
          state.roomRemoteStreams[peerUid] = ev.streams[0];
          this.renderRoomGrid6();
        }
      };

      const stream = await this.ensureCameraAndCanvasPipeline();
      if (state.roomPeerConnections[peerUid] !== pc) return pc;
      if (stream) {
        stream.getTracks().forEach(t => {
          try { pc.addTrack(t, stream); } catch(e) {}
        });
      }

      if (isInitiator) {
        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: peerUid,
            signalType: 'offer',
            sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
          }, peerUid, state.currentRoomId);
        } catch(e) {}
      } else {
        sendSignalToPeerAndRoom({
          type: 'webrtc_signal',
          roomId: state.currentRoomId,
          targetUid: peerUid,
          signalType: 'peer_ready'
        }, peerUid, state.currentRoomId);
      }
      return pc;
    },

    async handleRoomWebRTCSignal(data) {
      const peerUid = data.senderUid;
      const pc = await this.ensureRoomPeerConnection(peerUid, false);
      if (!pc) return;
      try {
        if (data.signalType === 'peer_ready' && state.uid > peerUid) {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: peerUid,
            signalType: 'offer',
            sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
          }, peerUid, state.currentRoomId);
        } else if (data.signalType === 'offer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          const q = state.roomIceQueues[peerUid] || [];
          while (q.length > 0) {
            await pc.addIceCandidate(new RTCIceCandidate(q.shift())).catch(() => {});
          }
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          sendSignalToPeerAndRoom({
            type: 'webrtc_signal',
            roomId: state.currentRoomId,
            targetUid: peerUid,
            signalType: 'answer',
            sdp: pc.localDescription ? { type: pc.localDescription.type, sdp: pc.localDescription.sdp } : null
          }, peerUid, state.currentRoomId);
        } else if (data.signalType === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          const q = state.roomIceQueues[peerUid] || [];
          while (q.length > 0) {
            await pc.addIceCandidate(new RTCIceCandidate(q.shift())).catch(() => {});
          }
        } else if (data.signalType === 'candidate' && data.candidate) {
          if (pc.remoteDescription && pc.remoteDescription.type) {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
          } else {
            if (!state.roomIceQueues[peerUid]) state.roomIceQueues[peerUid] = [];
            state.roomIceQueues[peerUid].push(data.candidate);
          }
        }
      } catch(e) {}
    },

    async switchCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Camera switching is not supported by this browser.'); return;
      }
      const button = document.getElementById('btn-camera-switch');
      const current = state.cameraFacingMode || 'user';
      const next = current === 'user' ? 'environment' : 'user';
      try {
        const newVideoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: next }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
        const newTrack = newVideoStream.getVideoTracks()[0];
        if (!newTrack) throw new Error('No camera track was returned.');
        const rawVideo = document.getElementById('raw-cam');
        const oldStream = state.rawStream;
        const audioTracks = oldStream ? oldStream.getAudioTracks() : [];
        const oldVideoTracks = oldStream ? oldStream.getVideoTracks() : [];
        const combined = new MediaStream([newTrack, ...audioTracks]);
        state.rawStream = combined;
        state.cameraFacingMode = next;
        if (rawVideo) { rawVideo.srcObject = combined; await rawVideo.play().catch(() => {}); }
        oldVideoTracks.forEach(t => { try { t.stop(); } catch(e) {} });
        // Canvas video track remains stable; keep microphone tracks enabled according to the user's setting.
        audioTracks.forEach(t => { t.enabled = !!state.micEnabled; });
        if (button) { button.title = next === 'user' ? 'Using front camera — switch to back' : 'Using back camera — switch to front'; button.setAttribute('aria-label', button.title); }
      } catch (err) {
        alert('Could not switch camera. Your device may have only one camera, or the browser may need camera permission.');
        console.warn('Chatkie camera switch failed:', err);
      } finally {
        // Stop any unused extra tracks returned by the temporary stream except the selected track.
        try { if (typeof newVideoStream !== 'undefined') {} } catch(e) {}
      }
    },

    spawnFlyingEmoji(emoji, fromUid, targetUid) {
      const container = document.getElementById('flying-container');
      const stage = document.getElementById('ck-video-stage');
      if (!container || !stage) return;
      const el = document.createElement('div'); el.className = 'ck-flying-emoji'; el.textContent = emoji;
      el.style.animation = 'none'; el.style.bottom = 'auto'; el.style.transform = 'translate(-50%,-50%)';
      const stageRect = stage.getBoundingClientRect();
      const centerFor = (uid) => {
        if (uid && state.isPublicRoomMode) {
          const slot = Array.from(document.querySelectorAll('.ck-room-slot')).find(node => node.getAttribute('data-occupant-uid') === String(uid));
          if (slot) { const r = slot.getBoundingClientRect(); return {x:r.left-stageRect.left+r.width/2,y:r.top-stageRect.top+r.height/2}; }
        }
        return null;
      };
      let from = centerFor(fromUid), to = centerFor(targetUid);
      if (!state.isPublicRoomMode) {
        const local = document.getElementById('local-pip-video'); const remote = document.getElementById('remote-video');
        const center = node => { if (!node) return null; const r=node.getBoundingClientRect(); return {x:r.left-stageRect.left+r.width/2,y:r.top-stageRect.top+r.height/2}; };
        if (fromUid === state.uid) { from = center(local) || {x:stageRect.width*.84,y:stageRect.height*.18}; to = center(remote) || {x:stageRect.width*.5,y:stageRect.height*.48}; }
        else if (targetUid === state.uid) { from = center(remote) || {x:stageRect.width*.5,y:stageRect.height*.48}; to = center(local) || {x:stageRect.width*.84,y:stageRect.height*.18}; }
      }
      from = from || {x:stageRect.width*(.2+Math.random()*.6), y:stageRect.height*.84};
      to = to || {x:stageRect.width*(.2+Math.random()*.6), y:stageRect.height*.36};
      el.style.left = from.x + 'px'; el.style.top = from.y + 'px'; container.appendChild(el);
      if (typeof el.animate === 'function') {
        el.animate([{left:from.x+'px',top:from.y+'px',opacity:1,transform:'translate(-50%,-50%) scale(.7)'},{left:to.x+'px',top:to.y+'px',opacity:.15,transform:'translate(-50%,-50%) scale(1.35)'}], {duration:950,easing:'cubic-bezier(.2,.75,.2,1)',fill:'forwards'});

  handleIncomingMeshPacket = function(data) {

    if(data && data.type==='room_host_changed' && data.targetUid===state.uid && data.roomId===state.currentRoomId) {
      const path=data.roomId && String(data.roomId).startsWith('cr_') ? 'ck_custom_rooms/'+data.roomId : 'ck_room_moderation/'+data.roomId;
      if(!fbDb) return;
      fbDb.ref(path).once('value').then(snap=>{
        const room=snap.val();
        if(room && String(room.hostUid)===String(state.uid) && String(room.hostUid)===String(data.hostUid)) {
          state.currentRoomHostUid=String(data.hostUid); ckUpdateRoomHostControls(); ckShowToast('You are now the room host.');
        }
      }).catch(()=>{}); return;
    }
    if(data && data.type==='room_kick' && data.targetUid===state.uid && data.roomId===state.currentRoomId) {
      const path=data.roomId && String(data.roomId).startsWith('cr_') ? 'ck_custom_rooms/'+data.roomId : 'ck_room_moderation/'+data.roomId;
      if(!fbDb) return;

        const seenKey='ck_knock_seen_'+snap.key; if(localStorage.getItem(seenKey)) return; localStorage.setItem(seenKey,'1');

        try { if(accepted) broadcastMeshPacket({type:'custom_room_access',targetUid:String(knock.fromUid),roomId:String(knock.roomId),roomName:String(knock.roomName),ownerUid:state.uid,hostUid:String((ckCustomRooms[knock.roomId]||{}).hostUid||state.uid)},PERSONAL_INBOX_PREFIX+String(knock.fromUid));

  }

  // Observe WebRTC state and basic RTT to label the quality of the active path.
  function ckStartQualityMonitor() {
    if(ckQualityTimer) clearInterval(ckQualityTimer);

      const label=document.getElementById('ck-network-quality'); const pc=state.peerConnection;
      if(!label) return;
      if(!pc || !state.currentPartnerUid) { label.textContent='📶 --'; label.title='No active video peer'; return; }
      let rtt=null;
      try {
        const stats=await pc.getStats();
        stats.forEach(item=>{if(item.type==='candidate-pair' && item.state==='succeeded' && item.nominated && Number.isFinite(item.currentRoundTripTime)) rtt=item.currentRoundTripTime;});
      } catch(e) {}
      if(['failed','disconnected'].includes(pc.iceConnectionState) || pc.connectionState==='failed') { label.textContent='📶 Poor'; label.title='Connection may need reconnecting'; }
      else if(rtt!==null && rtt<0.15 && pc.connectionState==='connected') { label.textContent='📶 Good'; label.title='Round-trip latency '+Math.round(rtt*1000)+' ms'; }
      else if(rtt!==null && rtt<0.35) { label.textContent='📶 Fair'; label.title='Round-trip latency '+Math.round(rtt*1000)+' ms'; }
      else if(pc.connectionState==='connected') { label.textContent='📶 Fair'; label.title='Connection is established; exact quality not available'; }
      else { label.textContent='📶 Connecting'; label.title='Waiting for the WebRTC connection'; }
    },2500);
  }

  // Keep the video/chat controls in view while Android/iOS opens the software keyboard.
  (function installChatKeyboardViewportGuard(){
    let savedScrollX = 0, savedScrollY = 0, restoreTimer = null;
    let pointerScrollX = 0, pointerScrollY = 0, pointerScrollAt = 0;
    const vv = window.visualViewport;
    function updateViewportHeight(){
      const h = vv && Number(vv.height) > 0 ? Number(vv.height) : window.innerHeight;
      document.documentElement.style.setProperty('--ck-visual-height', Math.max(240, Math.round(h)) + 'px');
    }
    function isChatInput(node){
      return !!node && (node.id === 'chat-input' || node.id === 'ck-text-chat-input');
    }
    function keepScroll(){
      try { window.scrollTo({ left:savedScrollX, top:savedScrollY, behavior:'auto' }); }
      catch(e) { window.scrollTo(savedScrollX, savedScrollY); }
    }
    updateViewportHeight();
    if(vv){ vv.addEventListener('resize', updateViewportHeight); vv.addEventListener('scroll', updateViewportHeight); }
    window.addEventListener('resize', updateViewportHeight);
    document.addEventListener('pointerdown', function(event){
      if(!isChatInput(event.target)) return;
      pointerScrollX = window.scrollX || 0;
      pointerScrollY = window.scrollY || 0;
      pointerScrollAt = Date.now();
    }, true);
    document.addEventListener('focusin', function(event){
      if(!isChatInput(event.target)) return;
      if(Date.now() - pointerScrollAt < 700) {
        savedScrollX = pointerScrollX;
        savedScrollY = pointerScrollY;
      } else {
        savedScrollX = window.scrollX || 0;
        savedScrollY = window.scrollY || 0;
      }
      if(event.target.id === 'chat-input') document.body.classList.add('ck-video-chat-keyboard-open');
      if(event.target.id === 'ck-text-chat-input') document.body.classList.add('ck-text-chat-keyboard-open');
      updateViewportHeight();
      requestAnimationFrame(keepScroll);
      setTimeout(keepScroll, 80);
      setTimeout(keepScroll, 220);
    }, true);
    document.addEventListener('focusout', function(event){
      if(!isChatInput(event.target)) return;
      if(restoreTimer) clearTimeout(restoreTimer);
      restoreTimer = setTimeout(function(){
        const active = document.activeElement;
        if(isChatInput(active)) return;
        document.body.classList.remove('ck-video-chat-keyboard-open','ck-text-chat-keyboard-open');
        updateViewportHeight();
      }, 120);
    }, true);
  })();
